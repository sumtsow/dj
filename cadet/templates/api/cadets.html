<div class="row">
    <div class="col">
       <h1>Курсанти</h1> 
    <table class="table table-striped">
        <thead>
            <tr>
                <th scope="col">Військове звання</th>
                <th scope="col">Прізвище, ім'я</th>
                <th scope="col">Дата народження</th>
                <th scope="col">Група</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>${ cadet.rank.title }</td>
                <td>${ cadet.lastname } ${ cadet.firstname }</td>
                <td>${ cadet.birthdate }</td>
                <td><a class="text-decoration-none" href="{% url 'group' cadet.group_id %}">${ cadet.group.title }</a></td>
            </tr>
        </tbody>
    </table>
    </div>
</div>
