<ul>
    <li>
        <a href="/">Головна</a>
    </li>
</ul>
{% if cadets %}
    <h1>Група</h1>
    <ul>
    {% for cadet in cadets %}
    <li>
        <a href="{% url 'cadet' cadet.id %}">
            {{ cadet.lastname }} {{ cadet.firstname }}: {{ cadet.birthdate }}
        </a>
    </li>
    {% endfor %}
    </ul>
{% else %}
    <h1>Курсанти в групі відсутні</h1>
{% endif %}
